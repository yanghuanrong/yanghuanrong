<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Yang Huanrong — GitHub Profile">
  <defs>
    <style type="text/css"><![CDATA[
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .display { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.04em; }
    ]]></style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="490" fill="#FFFFFF"/>

  <!-- left geometric slab -->
  <rect x="0" y="0" width="28" height="490" fill="#0A0A0A"/>
  <rect x="28" y="0" width="12" height="490" fill="#1F4BFF"/>

  <!-- top masthead -->
  <text class="sans" x="72" y="48" font-size="11" letter-spacing="4" fill="#0A0A0A">PROFILE · ISSUE 10</text>
  <text class="sans" x="1128" y="48" font-size="11" letter-spacing="4" fill="#0A0A0A" text-anchor="end">EST. 2016</text>
  <line x1="72" y1="62" x2="1128" y2="62" stroke="#0A0A0A" stroke-width="2"/>

  <!-- giant name block -->
  <text class="display" x="72" y="190" font-size="118" fill="#0A0A0A">YANG</text>
  <text class="display" x="72" y="300" font-size="118" fill="#0A0A0A">HUANRONG</text>

  <!-- divider into facts -->
  <line x1="72" y1="340" x2="1128" y2="340" stroke="#0A0A0A" stroke-width="1"/>

  <!-- fact columns -->
  <g class="sans">
    <text x="72" y="372" font-size="10" letter-spacing="2.5" fill="#6B6B6B">PUBLIC REPOS</text>
    <text x="72" y="410" font-size="36" font-weight="700" fill="#0A0A0A">39</text>

    <text x="250" y="372" font-size="10" letter-spacing="2.5" fill="#6B6B6B">FOLLOWERS</text>
    <text x="250" y="410" font-size="36" font-weight="700" fill="#0A0A0A">53</text>

    <text x="430" y="372" font-size="10" letter-spacing="2.5" fill="#6B6B6B">YEARS ON GITHUB</text>
    <text x="430" y="410" font-size="36" font-weight="700" fill="#0A0A0A">10</text>

    <text x="680" y="372" font-size="10" letter-spacing="2.5" fill="#6B6B6B">SIGNATURE</text>
    <text x="680" y="402" font-size="20" font-weight="700" fill="#0A0A0A">RelaxUI  ★101</text>
    <text x="680" y="426" font-size="13" fill="#6B6B6B">Vue2 UI · also RelaxPlus ★65 (Vue3)</text>
  </g>

  <!-- footer -->
  <line x1="72" y1="448" x2="1128" y2="448" stroke="#0A0A0A" stroke-width="2"/>
  <text class="sans" x="72" y="472" font-size="11" letter-spacing="2" fill="#0A0A0A">VUE · TS · SWIFT · AGENTS</text>
  <text class="sans" x="600" y="472" font-size="11" letter-spacing="1" fill="#1F4BFF" text-anchor="middle" font-weight="700">yanghuanrong.github.io</text>
  <text class="sans" x="1128" y="472" font-size="11" letter-spacing="2" fill="#0A0A0A" text-anchor="end">Nº 01</text>
</svg>
